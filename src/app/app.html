<router-outlet></router-outlet>

@if (showLoading()) {
  <div class="global-loading" role="status" aria-live="polite" aria-label="جارٍ التحميل">
    <div class="global-loading__grid" aria-hidden="true"></div>
    <div class="global-loading__orbit" aria-hidden="true">
      <!-- Orbit ring wires and sweeping beam -->
      <svg viewBox="0 0 420 420" class="global-loading__wires">
        <circle cx="210" cy="210" r="128" class="global-loading__ring"></circle>
        <circle cx="210" cy="210" r="83" class="global-loading__ring global-loading__ring--inner"></circle>
        <circle cx="210" cy="210" r="128" class="global-loading__pulse"></circle>
      </svg>

      <!-- Center SE7EN Hub -->
      <div class="global-loading__hub">
        <img src="assets/logo.png" alt="SE7EN" />
        <span>SE7EN</span>
      </div>

      <!-- 7 Orbit Pharmacy Stations (Baton Relay Handover: لوجو يسلم لوجو) -->
      @for (pharmacy of loadingPharmacies; track pharmacy.code; let i = $index) {
        <div
          class="global-loading__node"
          [style.--angle]="pharmacy.angle + 'deg'"
        >
          <!-- Subtle checkpoint dot on the orbit path -->
          <div class="global-loading__marker" aria-hidden="true"></div>

          <!-- Logo popup that appears, stays visible until all appear, then disappears in sequence -->
          <div
            class="global-loading__relay"
            [style.animation-delay]="(i * 200) + 'ms'"
          >
            <div class="global-loading__disk">
              <img [src]="pharmacy.logo" [alt]="pharmacy.code" />
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Loading caption -->
    <p class="global-loading__caption">
      <span>جارٍ تحميل الصفحة</span>
      <span class="global-loading__dots" aria-hidden="true">
        <i>.</i><i>.</i><i>.</i>
      </span>
    </p>
  </div>
}
