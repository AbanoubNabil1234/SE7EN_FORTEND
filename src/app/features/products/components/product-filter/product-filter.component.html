<div class="bg-white dark:bg-carbon-900/90 p-4 rounded-2xl border border-brand-200/50 dark:border-carbon-800 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between backdrop-blur-md">
      <!-- Search Input -->
      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-600 dark:text-brand-400">
          <i class="pi pi-search"></i>
        </div>
        <input
          type="text"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchChange.emit($event)"
          placeholder="Search by drug name, brand, active ingredient..."
          class="w-full pl-10 pr-4 py-2.5 bg-brand-50/40 dark:bg-carbon-950 border border-brand-200 dark:border-carbon-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-carbon-900 dark:text-white transition-all placeholder:text-carbon-400"
        />
      </div>

      <!-- Categories Filter Pills -->
      <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 scrollbar-none">
        @for (category of categories; track category) {
          <button
            type="button"
            (click)="categoryChange.emit(category)"
            class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all duration-200 cursor-pointer"
            [ngClass]="selectedCategory() === category
              ? 'bg-brand-500 text-carbon-950 shadow-brand border border-brand-400 font-extrabold'
              : 'bg-brand-50/70 dark:bg-carbon-800 text-carbon-700 dark:text-carbon-300 hover:bg-brand-100 dark:hover:bg-carbon-700 border border-transparent'"
          >
            {{ category }}
          </button>
        }
      </div>
    </div>
